model:
  name: "RandomForestClassifier"
  version: "1.2.4"
  hyperparameters:
    n_estimators: 100
    max_depth: 10
    min_samples_split: 5
    random_state: 42
  features:
    - studyTime
    - failures
    - absences
    - health
    - g1
    - g2
  thresholds:
    excellent: 12
    pass: 6

server:
  port: 3000
  env: "production"
  logging: "debug"
